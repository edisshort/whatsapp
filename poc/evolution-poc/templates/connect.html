{% extends "base.html" %}
{% block page_title %}Connect (QR){% endblock %}
{% block content %}
<div class="panel">
  <p>Session: <code>{{ session_name }}</code> · Status: <strong>{{ status }}</strong></p>
  {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
  <div class="d-flex flex-wrap gap-2 mb-3">
    <form method="post" action="{{ url_for('connect.start') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-wa">Start session</button></form>
    <a class="btn btn-outline-wa" href="{{ url_for('connect.qr') }}">Load QR</a>
  </div>
  <form method="post" action="{{ url_for('connect.disconnect') }}" class="border-top pt-3" onsubmit="return confirm('Logout WhatsApp on Evolution?')">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="d-block mb-2"><input type="checkbox" name="clear_local" value="yes"> Also clear synced contacts &amp; campaigns on this device</label>
    <button class="btn btn-outline-danger">Disconnect WhatsApp</button>
  </form>
  {% if qr_b64 %}
  <div class="text-center mt-3"><img alt="QR" class="img-fluid" style="max-width:280px" src="data:image/png;base64,{{ qr_b64 }}"><p class="small">Scan in WhatsApp → Linked devices</p></div>
  {% endif %}
</div>
{% endblock %}
